# CI/CD for the Ghana PAYE API.
#
#   lint ──► test (Python 3.12 / 3.13 / 3.14) ──► build image + smoke test ──► push to GHCR ──► deploy over SSH
#
# Pull requests only run lint + test. Pushes to main also build and publish the image,
# and deploy it once a server is configured (see "Enable deployment" in the README).
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"] # a tag like v1.2.0 also publishes the image as :1.2.0
  pull_request:
    branches: [main]
  workflow_dispatch: # allow a manual run from the Actions tab

# If a newer commit arrives on the same branch/PR, cancel the older run instead of
# letting both finish. Saves runner minutes and avoids two deploys racing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job can only read the repo, unless it asks for more below.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip # reuse downloaded packages between runs
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint # don't spend minutes testing code that doesn't pass lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let every Python version report, even if one fails
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --junitxml=test-results.xml

      # Keep the results even when tests fail, so they can be downloaded from the run.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  build:
    name: Build & publish image
    needs: test
    if: github.event_name != 'pull_request' # PRs are tested, never published
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GitHub Container Registry (ghcr.io)
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Work out the image tags: sha-<short commit>, the branch name (main),
      # and the version number when the push is a v* tag.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      # Build once and load it into the runner's Docker, so it can be tested before publishing.
      # The layer cache (type=gha) makes repeat builds much faster.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghana-paye-api:test
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the real image and call it, like a user would. A broken image never gets published.
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 ghana-paye-api:test
          for _ in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha'
          curl -fsS "http://127.0.0.1:8000/paye?basic=5000" | jq -e '.paye == 785.75'

      - name: Show container logs
        if: failure()
        run: docker logs api || true

      # GITHUB_TOKEN is created for every run and expires with it, so no registry password is stored.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the test build, so this is served from the cache rather than rebuilt.
      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  deploy:
    name: Deploy to server
    needs: build
    # Only main deploys, and only after a server is set up and the repo variable
    # DEPLOY_ENABLED is "true". Until then this job is skipped and the pipeline stays green.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in Settings → Environments
    # to make every production deploy wait for a manual approval.
    environment: production
    steps:
      - uses: actions/checkout@v7

      # The private key and the server's host key come from encrypted repository secrets.
      # Pinning known_hosts means the runner refuses to talk to an impostor server.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Copy the compose file, then run the deploy script on the server. The script pulls
      # sha-<commit>, checks /health reports this commit, and rolls back if it doesn't.
      - name: Deploy and verify
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp deploy/compose.yaml "$TARGET:/opt/ghana-paye-api/compose.yaml"
          ssh "$TARGET" 'bash -s' -- "sha-${GITHUB_SHA::7}" "$GITHUB_SHA" < deploy/remote-deploy.sh
